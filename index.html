<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vuth Vichheka</title>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--rainbow:#ff0040,#ff8c00,#ffe600,#00e676,#00b0ff,#7c4dff,#ff00c8,#ff0040;--muted:#a5b4cf}
*{box-sizing:border-box;margin:0;padding:0}
body{
  /* static background: no repaint, no lag */
  background:
    radial-gradient(circle at 10% 0%,rgba(255,0,64,.28),transparent 45%),
    radial-gradient(circle at 100% 100%,rgba(0,176,255,.28),transparent 45%),
    radial-gradient(circle at 80% 40%,rgba(124,77,255,.22),transparent 40%),
    linear-gradient(135deg,#0f172a,#1e1b4b,#311042);
  color:#fff;font-family:'Poppins',system-ui,sans-serif;
  display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;
}
.wrap{width:100%;max-width:450px;border-radius:26px;padding:3px;
  background:linear-gradient(135deg,var(--rainbow));
  animation:pop .8s cubic-bezier(.16,1,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.container{background:#141a30;border-radius:23px;padding:40px 20px 28px;text-align:center}

/* avatar: only transform animations (GPU, cheap) */
.avatar-box{width:150px;height:150px;margin:0 auto 22px;position:relative;animation:float 3.5s ease-in-out infinite;will-change:transform}
.avatar-box::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--rainbow));animation:spin 5s linear infinite;will-change:transform}
.avatar{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:50%;
  object-fit:cover;object-position:center 30%;border:4px solid #141a30}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

h1{font-family:'Kantumruy Pro','Poppins',sans-serif;font-size:30px;font-weight:700;line-height:1.4;margin-bottom:6px;
  background:linear-gradient(90deg,var(--rainbow));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent}

/* flowing rainbow line: moves with transform only */
.flow{height:4px;width:140px;margin:0 auto 18px;border-radius:4px;overflow:hidden}
.flow i{display:block;height:100%;width:200%;background:linear-gradient(90deg,var(--rainbow),var(--rainbow));
  animation:slideflow 3s linear infinite;will-change:transform}
@keyframes slideflow{to{transform:translateX(-50%)}}

p{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:24px}

.btn-link{position:relative;display:flex;align-items:center;justify-content:center;
  background:#334155;color:#fff;text-decoration:none;padding:15px 20px;margin:14px 0;border-radius:14px;
  font-weight:600;font-size:15px;overflow:hidden;isolation:isolate;
  transition:transform .25s ease,color .25s ease;animation:slide .6s ease both}
.btn-link:nth-of-type(1){animation-delay:.3s}
.btn-link:nth-of-type(2){animation-delay:.42s}
.btn-link:nth-of-type(3){animation-delay:.54s}
.btn-link:nth-of-type(4){animation-delay:.66s}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.btn-link::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s ease;
  background:linear-gradient(90deg,var(--rainbow))}
.btn-link:hover,.btn-link:focus-visible{transform:translateY(-3px);color:#0b0f1f;outline:none}
.btn-link:hover::before,.btn-link:focus-visible::before{opacity:1}
.btn-link:active{transform:scale(.98)}

.footer{margin-top:24px;font-size:12px;color:#7b8aa6}
.credit{margin-top:8px;font-size:14px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--rainbow));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent}

@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
